[package]
name = "agnos-scripts"
version = "0.1.0"
description = "AGNOS genesis build scripts — sovereign boot pipeline in Cyrius"
license = "GPL-3.0-only"
repository = "https://github.com/MacCracken/agnosticos"
cyrius = "3.9.8"

[build]
entry = "src/boot.cyr"
output = "boot"

[[programs]]
name = "boot"
src = "src/boot.cyr"
output = "build/boot"
description = "Assemble and boot AGNOS from components (kernel, toolchain, recipes)"

[[programs]]
name = "validate"
src = "src/validate.cyr"
output = "build/validate"
description = "Selfhost validation — prove AGNOS can rebuild itself"

[deps]
stdlib = ["string", "fmt", "alloc", "io", "vec", "str", "args", "process", "fs", "toml", "tagged", "syscalls"]

[deps.agnosys]
git = "https://github.com/MacCracken/agnosys"
path = "../agnosys"
tag = "0.97.2"
modules = ["lib/syscalls_linux.cyr"]
