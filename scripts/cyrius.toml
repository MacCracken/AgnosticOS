[package]
name = "agnos-scripts"
version = "0.1.0"
description = "AGNOS genesis build scripts — sovereign boot pipeline in Cyrius"
license = "GPL-3.0-only"
repository = "https://github.com/MacCracken/agnosticos"
cyrius = "3.10.3"

[[programs]]
name = "boot"
src = "src/boot.cyr"
output = "build/boot"
description = "Assemble and boot AGNOS from components"

[deps]
stdlib = ["string", "fmt", "alloc", "io", "vec", "str", "args", "syscalls", "tagged", "process", "fs"]
